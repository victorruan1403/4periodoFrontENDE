<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Css</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- Exemplo de CSS Interno -->

<body>
    <main style="background-color: black;">
        <!-- Exemplo de CSS Inline -->
        <section id="inline">
            <h1>Exemplo Inline</h1>
        </section>


        <!-- Exemplo de CSS Interno -->
        <section id="interno">
            <h1>Exemplo Interno</h1>
        </section>


        <!-- Exemplo de CSS Externo -->
        <section id="externo">
            <h1>Exemplo Externo</h1>
            <div>
                <h1>Exemplo Css Externo 2 </h1>
                <span>
                    <h1>Exemplo Css Externo 3</h1>
                </span>
                <h1>Exemplo Css Externo 4</h1>
                <p>Exemplo 1</p>
                <span>
                    <p>Exemplo 2</p>
                </span>
            </div>
            <button class="btn">
                Clique aqui
            </button>
        </section>
    </main>
</body>

</html>
